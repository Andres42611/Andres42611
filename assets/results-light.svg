<text x="590.0" y="270" text-anchor="middle" class="tick">1 s</text>
<text x="690.0" y="270" text-anchor="middle" class="tick">2 s</text>
<text x="790.0" y="270" text-anchor="middle" class="tick">4 s</text>
<text x="890.0" y="270" text-anchor="middle" class="tick">8 s</text>
<clipPath id="rb"><rect x="548" y="60" width="384" height="200"><animate attributeName="width" values="0;384" dur="1.6s" begin="0s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .25 1"/></rect></clipPath><g clip-path="url(#rb)"><path d="M590.0,149.4 L690.0,166.3 L790.0,154.6 L884.0,152.7" fill="none" stroke="#0969da" stroke-width="1.5" stroke-opacity=".55"/>
