<line x1="790.0" x2="790.0" y1="169.4" y2="138.5" stroke="#0969da" stroke-width="2"/>
<circle cx="790.0" cy="154.6" r="4.5" fill="#0969da"/>
<line x1="884.0" x2="884.0" y1="168.6" y2="136.3" stroke="#0969da" stroke-width="2"/>
<circle cx="884.0" cy="152.7" r="4.5" fill="#0969da"/>
<line x1="896.0" x2="896.0" y1="188.5" y2="162.1" stroke="#59636e" stroke-width="2"/>
<circle cx="896.0" cy="175.4" r="4" fill="none" stroke="#59636e" stroke-width="1.5"/></g>
<text x="560" y="40" class="title">SegViT: what the next song tells you</text>
<text x="560" y="62" class="sub">Bits per token gained from seeing it, by gap length (95% CI)</text>
<text x="740.0" y="294" text-anchor="middle" class="tick">gap between songs (open circle: second seed)</text>
</svg>
